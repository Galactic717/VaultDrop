name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    # The copier talks to Windows file APIs, so the tests run where users do.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "xxhash>=3" pytest mypy==2.2.0
      - run: python -m pytest -q
      - run: python -m mypy src-core --ignore-missing-imports
